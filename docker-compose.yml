  services:
    postgres:
      image: postgres:15
      environment:
        POSTGRES_USER: ${POSTGRES_USER:-qversity-admin}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qversity-admin}
        POSTGRES_DB: ${POSTGRES_DB:-qversity}
      volumes:
        - postgres_data:/var/lib/postgresql/data
      ports:
        - "5432:5432"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
        interval: 10s
        timeout: 5s
        retries: 5


    airflow:
      build:
        context: .
        dockerfile: Dockerfile.airflow
      restart: on-failure
      group_add:
        - "999"
      depends_on:
        postgres:
          condition: service_healthy
        dbt:
          condition: service_healthy
      environment:
        # Airflow metadata database
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-qversity-admin}:${POSTGRES_PASSWORD:-qversity-admin}@postgres/${POSTGRES_DB:-qversity}
        AIRFLOW_CONN_POSTGRES_DEFAULT: postgresql+psycopg2://${POSTGRES_USER:-qversity-admin}:${POSTGRES_PASSWORD:-qversity-admin}@postgres/${POSTGRES_DB:-qversity}
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
        # PostgreSQL connection details (used by Python + PySpark tasks)
        POSTGRES_HOST: postgres
        POSTGRES_PORT: "5432"
        POSTGRES_DB: ${POSTGRES_DB:-qversity}
        POSTGRES_USER: ${POSTGRES_USER:-qversity-admin}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qversity-admin}
        # JDBC jar path (pre-downloaded in Dockerfile.airflow)
        SPARK_JDBC_JAR: /opt/airflow/jars/postgresql-42.7.3.jar
        # Java home (set in Dockerfile but repeated here for safety)
        JAVA_HOME: /usr/lib/jvm/default-java
      volumes:
        - ./dags:/opt/airflow/dags
        - ./spark:/opt/airflow/spark
        - ./logs:/opt/airflow/logs
        - ./data:/opt/airflow/data
        - /var/run/docker.sock:/var/run/docker.sock
      ports:
        - "8080:8080"
      healthcheck:
        test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')\""]
        interval: 15s
        timeout: 10s
        retries: 10
        start_period: 120s
      command: >
        bash -c "
        airflow db init &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com &&
        airflow webserver & airflow scheduler
        "



    dbt:
      container_name: qversity_dbt
      image: python:3.11
      volumes:
        - ./dbt:/dbt
        - ./data:/data
      working_dir: /dbt
      command: >
        bash -c "
        pip install --no-cache-dir dbt-core==1.7.0 dbt-postgres==1.7.0 'protobuf>=4.0,<5' &&
        sleep infinity
        "
      depends_on:
        postgres:
          condition: service_healthy
      environment:
        DBT_PROFILES_DIR: /dbt
      healthcheck:
        test: ["CMD", "dbt", "--version"]
        interval: 10s
        timeout: 5s
        retries: 12
        start_period: 180s

  volumes:
    postgres_data: